<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container narrow">
    <h1>Login</h1>
    <p class="subtitle">Enter your details to continue.</p>

    <div id="message" class="message"></div>

    <form class="box" id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <p><button class="btn full" type="submit">Login</button></p>
      <p>New here? <a href="register.html">Create an account</a></p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const data = await api("/auth/login", "POST", { email, password });
        saveToken(data.token);
        localStorage.setItem("role", data.role);
        window.location.href = "index.html";
      } catch (error) {
        showMessage(error.message, "error");
      }
    });
  </script>
</body>
</html>
